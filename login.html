    <script src="script.js"></script>
    <script>
        (function() {
            var tabs = document.querySelectorAll('.auth-tab');
            var panels = document.querySelectorAll('.auth-panel');
            var params = new URLSearchParams(window.location.search);
            var mode = params.get('mode');
            var errors = params.get('errors');
            var errorBox = document.getElementById('auth-errors');

            function activateTab(targetId) {
                tabs.forEach(function(t) { t.classList.remove('is-active'); });
                panels.forEach(function(panel) { panel.classList.remove('is-active'); });
                var targetTab = Array.prototype.find.call(tabs, function(t) {
                    return t.getAttribute('data-target') === targetId;
                });
                var panel = document.getElementById(targetId);
                if (targetTab) targetTab.classList.add('is-active');
                if (panel) panel.classList.add('is-active');
            }

            if (mode === 'register') {
                activateTab('register-panel');
            } else if (mode === 'login') {
                activateTab('login-panel');
            }

            if (errors && errorBox) {
                var list = errors.split(',').filter(Boolean);
                if (list.length) {
                    errorBox.innerHTML = '';
                    list.forEach(function(key) {
                        var item = document.createElement('div');
                        item.setAttribute('data-i18n', key);
                        item.textContent = key;
                        errorBox.appendChild(item);
                    });
                    errorBox.hidden = false;
                    if (typeof applyI18n === 'function') {
                        applyI18n(window.currentLang || 'ar');
                    }
                }
            }

            tabs.forEach(function(tab) {
                tab.addEventListener('click', function() {
                    var targetId = tab.getAttribute('data-target');
                    activateTab(targetId);
                });
            });
        })();
    </script>
